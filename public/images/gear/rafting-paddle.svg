    <path d="M-3 716 L-2 1098" stroke="#D5DBE0" stroke-width="2.5" opacity="0.8"/>
    <rect x="-20" y="690" width="40" height="26" rx="5" fill="url(#pshaft)"/>
    <rect x="-20" y="690" width="40" height="4" rx="2" fill="#1C1F22"/>
    <text transform="translate(54 1060) rotate(-90)" font-family="Arial, Helvetica, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" font-size="21" letter-spacing="3" fill="#5F676E">ADVENTURE PARK</text>
  </g>
  
