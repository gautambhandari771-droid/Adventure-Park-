<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="t d">
  <title id="t">Rafting paddle, white and grey</title>
  <desc id="d">Rafting paddle with a white T-grip, charcoal aluminium shaft with grey grip sleeve, and a white blade with grey edge and spine.</desc>
  <defs>
    <radialGradient id="pbg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#F3F5F7"/>
      <stop offset="0.55" stop-color="#E1E6EA"/>
      <stop offset="1" stop-color="#B9C1C8"/>
    </radialGradient>
    <linearGradient id="pfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="pbggrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#pbg)"/>
  <rect y="760" width="1200" height="440" fill="url(#pfloor)"/>
  <rect width="1200" height="1200" filter="url(#pbggrain)"/>
  <defs>
    <filter id="pb3" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="3"/></filter><filter id="pb6" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="6"/></filter><filter id="pb10" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="10"/></filter><filter id="pb22" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="22"/></filter><filter id="pb40" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="pplastic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
    </filter>
    <filter id="pfabric" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6 0.22" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.15"/></feComponentTransfer>
    </filter>
    <filter id="pwebbing" x="0" y="0" width="100%" height="100%">
