    <clipPath id="pbladeClip"><path d="M-16 700 C-16 742 -62 764 -88 792 C-100 806 -102 832 -100 862 L-94 1080 C-90 1132 -52 1152 0 1152 C52 1152 90 1132 94 1080 L100 862 C102 832 100 806 88 792 C62 764 16 742 16 700 Z"/></clipPath>
