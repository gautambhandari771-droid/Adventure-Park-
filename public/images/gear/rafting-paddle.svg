    <g transform="translate(24 12)" opacity="0.28" filter="url(#pb6)">
    <path d="M-80 14 C-82 -2 -66 -10 -44 -8 L44 -8 C66 -10 82 -2 80 14 C80 34 64 42 42 40 L24 40 C14 40 12 48 12 58 L12 78 L-12 78 L-12 58 C-12 48 -14 40 -24 40 L-42 40 C-64 42 -80 34 -80 14 Z" fill="#1F252A"/>
    <rect x="-17" y="70" width="34" height="650" fill="#1F252A"/>
    <path d="M-16 700 C-16 742 -62 764 -88 792 C-100 806 -102 832 -100 862 L-94 1080 C-90 1132 -52 1152 0 1152 C52 1152 90 1132 94 1080 L100 862 C102 832 100 806 88 792 C62 764 16 742 16 700 Z" fill="#1F252A"/></g>

    <!-- shaft -->
    <rect x="-17" y="70" width="34" height="650" fill="url(#pshaft)"/>
    <rect x="-17" y="70" width="34" height="650" filter="url(#pplastic)"/>
    <rect x="-19" y="96" width="38" height="150" rx="4" fill="url(#psleeve)"/>
    <rect x="-19" y="96" width="38" height="150" rx="4" fill="url(#pknurl)"/>
    <rect x="-19" y="96" width="38" height="6" rx="3" fill="#2C3136"/>
    <rect x="-19" y="240" width="38" height="6" rx="3" fill="#2C3136"/>

    <!-- T-grip -->
    <path d="M-80 14 C-82 -2 -66 -10 -44 -8 L44 -8 C66 -10 82 -2 80 14 C80 34 64 42 42 40 L24 40 C14 40 12 48 12 58 L12 78 L-12 78 L-12 58 C-12 48 -14 40 -24 40 L-42 40 C-64 42 -80 34 -80 14 Z" fill="url(#pgrip)"/>
    <path d="M-66 2 C-50 -2 50 -2 66 2" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M-76 22 C-70 34 -50 36 -30 34 M76 22 C70 34 50 36 30 34" fill="none" stroke="#7F8890" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <rect x="-16" y="64" width="32" height="14" rx="3" fill="#868F97"/>

    <!-- blade -->
    <path d="M-16 700 C-16 742 -62 764 -88 792 C-100 806 -102 832 -100 862 L-94 1080 C-90 1132 -52 1152 0 1152 C52 1152 90 1132 94 1080 L100 862 C102 832 100 806 88 792 C62 764 16 742 16 700 Z" fill="url(#pblade)"/>
    <g clip-path="url(#pbladeClip)">
      <path d="M-16 690 C-16 742 -62 764 -88 792" fill="none" stroke="#000" stroke-width="18" opacity="0.16" filter="url(#pb10)"/>
      <ellipse cx="-34" cy="920" rx="26" ry="190" fill="#FFFFFF" opacity="0.85" filter="url(#pb10)"/>
      <!-- moulded lip just inside the edge -->
      <path d="M-6 742 C-30 768 -64 784 -78 802 C-86 814 -88 836 -86 862 L-80 1074 C-77 1118 -46 1136 0 1136 C46 1136 77 1118 80 1074 L86 862 C88 836 86 814 78 802 C64 784 30 768 6 742" fill="none" stroke="#B9C1C8" stroke-width="5" opacity="0.8"/>
      <path d="M-6 742 C-30 768 -64 784 -78 802 C-86 814 -88 836 -86 862 L-80 1074 C-77 1118 -46 1136 0 1136 C46 1136 77 1118 80 1074 L86 862 C88 836 86 814 78 802 C64 784 30 768 6 742" fill="none" stroke="#FFFFFF" stroke-width="2" transform="translate(-2 -2)" opacity="0.9"/>
      <rect x="-120" y="680" width="240" height="500" filter="url(#pplastic)"/>
    </g>
    <path d="M-16 700 C-16 742 -62 764 -88 792 C-100 806 -102 832 -100 862 L-94 1080 C-90 1132 -52 1152 0 1152 C52 1152 90 1132 94 1080 L100 862 C102 832 100 806 88 792 C62 764 16 742 16 700 Z" fill="none" stroke="#5F676E" stroke-width="9"/>
    <path d="M-16 700 C-16 742 -62 764 -88 792 C-100 806 -102 832 -100 862 L-94 1080 C-90 1132 -52 1152 0 1152 C52 1152 90 1132 94 1080 L100 862 C102 832 100 806 88 792 C62 764 16 742 16 700 Z" fill="none" stroke="#B5BDC4" stroke-width="2" transform="translate(-1 -1)" opacity="0.7"/>
