      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer>
    </filter>
    <linearGradient id="preflect" x1="0" y1="0" x2="1" y2="0">
