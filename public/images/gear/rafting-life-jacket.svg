<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="t d">
  <title id="t">Rafting life jacket, white and grey</title>
  <desc id="d">White rafting life jacket with a grey head-support collar, grey side panels and binding, three black buckled straps and reflective tape.</desc>
  <defs>
