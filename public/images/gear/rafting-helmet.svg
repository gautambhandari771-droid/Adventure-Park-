<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="t d">
  <title id="t">Rafting helmet, white and grey</title>
  <desc id="d">White whitewater helmet with a charcoal-grey stripe, peak and edge trim, grey ear covers, black chin strap and buckle.</desc>
  <defs>
    <radialGradient id="hbg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#F3F5F7"/>
      <stop offset="0.55" stop-color="#E1E6EA"/>
      <stop offset="1" stop-color="#B9C1C8"/>
    </radialGradient>
    <linearGradient id="hfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="hbggrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#hbg)"/>
  <rect y="760" width="1200" height="440" fill="url(#hfloor)"/>
  <rect width="1200" height="1200" filter="url(#hbggrain)"/>
  <defs>
    <filter id="hb3" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="3"/></filter><filter id="hb6" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="6"/></filter><filter id="hb10" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="10"/></filter><filter id="hb22" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="22"/></filter><filter id="hb40" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2800" height="2800"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="hplastic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.06"/></feComponentTransfer>
    </filter>
    <filter id="hfabric" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6 0.22" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.15"/></feComponentTransfer>
    </filter>
    <filter id="hwebbing" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.25 2.4" numOctaves="1" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer>
    </filter>
    <linearGradient id="hreflect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D0D6"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#B4BCC3"/>
      <stop offset="0.75" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#AEB7BF"/>
    </linearGradient>
    <linearGradient id="hbuckle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5056"/>
      <stop offset="0.25" stop-color="#2A2E32"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
  </defs>
  <defs>
    <linearGradient id="hshell" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#EDF0F3"/>
      <stop offset="0.8" stop-color="#C8CFD5"/>
      <stop offset="1" stop-color="#959FA8"/>
    </linearGradient>
    <linearGradient id="hstripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#727A82"/>
      <stop offset="0.5" stop-color="#3F454B"/>
      <stop offset="1" stop-color="#2C3136"/>
    </linearGradient>
    <linearGradient id="hpeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626A71"/>
      <stop offset="0.55" stop-color="#2C3136"/>
      <stop offset="1" stop-color="#1B1E21"/>
    </linearGradient>
    <radialGradient id="hear" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#BCC3CA"/>
      <stop offset="0.6" stop-color="#868F97"/>
      <stop offset="1" stop-color="#5F676E"/>
    </radialGradient>
    <linearGradient id="hvent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1012"/>
      <stop offset="1" stop-color="#3A4046"/>
    </linearGradient>
    <clipPath id="hshellClip"><path d="M392 646 C380 520 456 356 650 334 C806 318 904 424 906 568 C907 634 894 680 872 704 C866 712 858 715 846 714 C770 712 660 702 560 692 C490 686 430 672 392 646 Z"/></clipPath>
    <path id="hdecalPath" d="M450 574 C540 516 680 496 890 520"/>
  </defs>

  <!-- floor shadows -->
  <ellipse cx="640" cy="726" rx="320" ry="40" fill="#000" opacity="0.2" filter="url(#hb22)"/>
  <path d="M400 652 C440 680 500 694 560 700 C660 710 770 718 860 720" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" opacity="0.4" filter="url(#hb6)" transform="translate(0 6)"/>

  <!-- chin strap spilling onto the floor -->
  <path d="M520 700 C512 760 540 796 600 806 C670 814 742 800 790 724" fill="none" stroke="#000" stroke-width="26" opacity="0.22" filter="url(#hb6)" transform="translate(4 8)"/>
  <path d="M520 694 C512 752 538 788 590 798" fill="none" stroke="#191C1F" stroke-width="20" stroke-linecap="round"/>
  <path d="M792 718 C774 780 722 802 660 802" fill="none" stroke="#191C1F" stroke-width="20" stroke-linecap="round"/>
  <path d="M514 694 C506 752 532 784 586 792" fill="none" stroke="#454B51" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M786 718 C768 774 718 794 660 795" fill="none" stroke="#454B51" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g transform="translate(624 800) rotate(-2)">
    <rect x="-40" y="-17" width="46" height="34" rx="7" fill="url(#hbuckle)"/>
    <path d="M6 -14 L38 -10 C44 -9 46 -4 46 0 C46 4 44 9 38 10 L6 14 Z" fill="url(#hbuckle)"/>
    <rect x="-34" y="-11" width="16" height="22" rx="3" fill="#0B0D0F"/>
    <path d="M-38 -14 L2 -14" stroke="#7A828A" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M10 -9 L36 -6" stroke="#6E767E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- shell -->
  <path d="M392 646 C380 520 456 356 650 334 C806 318 904 424 906 568 C907 634 894 680 872 704 C866 712 858 715 846 714 C770 712 660 702 560 692 C490 686 430 672 392 646 Z" fill="url(#hshell)"/>
  <g clip-path="url(#hshellClip)">
    <ellipse cx="910" cy="640" rx="170" ry="220" fill="#56606A" opacity="0.45" filter="url(#hb40)"/>
    <!-- grey stripe -->
    <path d="M384 590 C470 486 650 444 920 478 L922 552 C700 512 520 540 380 632 Z" fill="url(#hstripe)"/>
    <path d="M386 586 C472 482 650 440 920 474" fill="none" stroke="#A3ACB3" stroke-width="3" opacity="0.8"/>
    <path d="M382 628 C522 536 700 508 922 548" fill="none" stroke="#151719" stroke-width="3" opacity="0.6"/>
    <!-- soft floor bounce on the lower shell -->
    <path d="M400 676 C520 690 700 704 900 716" fill="none" stroke="#FFFFFF" stroke-width="30" opacity="0.25" filter="url(#hb10)"/>
    <!-- softbox reflection -->
    <rect x="470" y="372" width="230" height="58" rx="29" fill="#FFFFFF" opacity="0.9" transform="rotate(-12 585 401)" filter="url(#hb10)"/>
    <path d="M500 398 C548 368 608 352 668 350" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" filter="url(#hb3)"/>
    <path d="M830 392 C884 440 904 508 900 584" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.5" filter="url(#hb3)"/>
    <!-- charcoal rubber edge trim -->
    <path d="M380 640 C430 676 490 688 560 696 C660 706 770 716 870 722" fill="none" stroke="#3F454B" stroke-width="30"/>
    <path d="M380 640 C430 676 490 688 560 696 C660 706 770 716 870 722" fill="none" stroke="#7D858C" stroke-width="2" transform="translate(0 -15)" opacity="0.8"/>
    <rect width="1200" height="1200" filter="url(#hplastic)"/>
  </g>
  <text font-family="Arial, Helvetica, 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" font-size="25" letter-spacing="5" fill="#E9EDF0" opacity="0.92">
    <textPath href="#hdecalPath" startOffset="16%">ADVENTURE PARK</textPath>
  </text>

  <!-- vents -->
  <g transform="rotate(-24 548 384)"><ellipse cx="548" cy="384" rx="42" ry="11" fill="url(#hvent)"/><path d="M508 388 Q548 400 588 388" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/></g>
  <g transform="rotate(-5 654 354)"><ellipse cx="654" cy="354" rx="44" ry="11" fill="url(#hvent)"/><path d="M612 358 Q654 370 696 358" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/></g>
  <g transform="rotate(15 760 368)"><ellipse cx="760" cy="368" rx="42" ry="11" fill="url(#hvent)"/><path d="M720 372 Q760 384 800 372" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/></g>
  <g fill="url(#hvent)">
    <rect x="770" y="510" width="44" height="9" rx="4.5" transform="rotate(6 792 514)"/>
    <rect x="830" y="520" width="38" height="9" rx="4.5" transform="rotate(8 849 524)"/>
  </g>

  <!-- short peak -->
  <path d="M422 578 C394 580 358 590 338 602 C330 608 332 618 344 620 C372 624 404 628 434 634 C432 612 428 592 422 578 Z" fill="url(#hpeak)"/>
  <path d="M346 602 C368 592 394 586 420 584" fill="none" stroke="#9AA2A9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="420" cy="608" r="6" fill="#8F979E"/><circle cx="420" cy="608" r="2.5" fill="#3A4046"/>

  <!-- ear cover -->
  <path d="M662 606 C662 574 702 562 752 564 C802 566 826 592 824 632 C822 692 802 738 752 746 C702 752 666 722 662 682 Z" fill="#000" opacity="0.25" filter="url(#hb10)" transform="translate(4 8)"/>
  <path d="M662 606 C662 574 702 562 752 564 C802 566 826 592 824 632 C822 692 802 738 752 746 C702 752 666 722 662 682 Z" fill="url(#hear)"/>
  <path d="M674 604 C676 584 706 576 748 578" fill="none" stroke="#E4E8EB" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <g fill="#2C3136">
    <circle cx="722" cy="640" r="6"/><circle cx="748" cy="636" r="6"/><circle cx="774" cy="640" r="6"/>
    <circle cx="734" cy="664" r="6"/><circle cx="760" cy="662" r="6"/><circle cx="786" cy="664" r="5.5"/>
    <circle cx="746" cy="688" r="5.5"/><circle cx="772" cy="688" r="5.5"/>
  </g>
  <circle cx="700" cy="600" r="5" fill="#C9D0D6"/>
  
</svg>
